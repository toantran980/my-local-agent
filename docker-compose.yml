services:
  # ---------------------------------------------------------------
  # 1. Inference backend: Ollama in Docker (OPTIONAL; off by default)
  #    Default setup uses the Ollama running on the host (port 11434), and
  #    both would fight for that port. To use the container instead, quit the
  #    host Ollama, then: docker compose --profile ollama up -d ollama
  # ---------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: local_ollama
    profiles: ["ollama"]
    restart: unless-stopped
    ports:
      # bind to localhost only - the Ollama API has NO auth
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=-1                # never unload the model (0 = unload between chats)
      - OLLAMA_NUM_PARALLEL=1               # 1 concurrent request => predictable VRAM
      - OLLAMA_MAX_LOADED_MODELS=1          # only one model resident at a time on 16GB
      - OLLAMA_CONTEXT_LENGTH=16384         # per-request KV ceiling; see VRAM table
      - OLLAMA_FLASH_ATTENTION=1            # FA2 path on Blackwell
      - OLLAMA_KV_CACHE_TYPE=q8_0           # quantized KV halves cache memory
      - OLLAMA_GPU_OVERHEAD=1024            # reserve 1GB for driver/desktop overhead
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ---------------------------------------------------------------
  # 2. OPTIONAL chat UI: Open WebUI (disabled by default; terminal use)
  #    Enable: docker compose --profile webui up -d open-webui
  #    Browser: http://localhost:3000  (first signup = admin)
  # ---------------------------------------------------------------
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    profiles: ["webui"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:8080"
    volumes:
      - open_webui_data:/app/backend/data
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434 # container-to-container, never leaves the VM
    depends_on:
      - ollama

  # ---------------------------------------------------------------
  # 3. MCP -> OpenAPI bridge. Open WebUI can only talk to HTTP
  #    tool servers, so mcpo wraps stdio MCP servers (filesystem,
  #    fetch) as OpenAPI endpoints. Add as "OpenAPI" tool servers.
  # ---------------------------------------------------------------
  mcpo:
    build: ./mcpo
    container_name: mcpo
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # the agent's file sandbox: ./workspace on the host <-> /workspace here
      - ./workspace:/workspace
      # self-authored local_ops MCP server + the state it reports on
      - ./mcp:/opt/mcp
      - ./mcpo/config.json:/config/config.json:ro    # mount updated config
      - ./reports:/data/reports:ro
      - ./eval:/data/eval
      # read-only view of this repo (swap for the repo you want git_state
      # to inspect by default; e.g. - /home/you/myapp:/repo:ro)
      - .:/repo:ro
      # HOMELAB EXPANSION: Uncomment and configure these for project access
      # Option 1: Use Linux filesystem (recommended for WSL2 performance)
      # - ${MY_LOCAL_AGENT_ROOT:-/home/$USER}/projects:/projects:ro
      # - ${MY_LOCAL_AGENT_ROOT:-/home/$USER}/configs:/configs:ro
      # - ${MY_LOCAL_AGENT_ROOT:-/home/$USER}/logs:/logs:ro
      # Option 2: Use Windows filesystem (slower but accessible from Windows)
      # - ${MY_LOCAL_AGENT_ROOT:-/mnt/c/Users/$USER}/projects:/projects:ro
      # - ${MY_LOCAL_AGENT_ROOT:-/mnt/c/Users/$USER}/configs:/configs:ro
      # - ${MY_LOCAL_AGENT_ROOT:-/mnt/c/Users/$USER}/logs:/logs:ro

  # ---------------------------------------------------------------
  # OPTIONAL: Authentication Proxy (for homelab network access)
  # Uncomment when ready to expose services beyond localhost
  # Provides basic auth and TLS termination for safe network access
  #   docker compose --profile auth up -d auth_proxy
  # ---------------------------------------------------------------
  auth_proxy:
    image: caddy:latest
    container_name: auth_proxy
    profiles: ["auth"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8443:443"      # HTTPS endpoint for local access
      # - "192.168.1.100:8443:443"  # Uncomment for LAN access
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/data:/data
      - ./caddy/config:/config
    environment:
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-changeme}

  # ---------------------------------------------------------------
  # OPTIONAL: vLLM (higher throughput). Start it only after Ollama
  # works. READ the vLLM section in README.md first - consumer
  # Blackwell (sm_120) needs specific wheels/kernel workarounds.
  #   docker compose --profile vllm up -d vllm
  #   Serve endpoint: http://localhost:8001/v1
  # ---------------------------------------------------------------
  vllm:
    image: vllm/vllm-openai:latest
    container_name: local_vllm
    profiles: ["vllm"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - vllm_cache:/root/.cache/huggingface
    shm_size: 1g
    environment:
      # workaround for the SM120 FP8 GEMM hang (see README failure points)
      - VLLM_DISABLED_KERNELS=CutlassFp8BlockScaledMMKernel,FlashInferFp8DeepGEMMDynamicBlockScaledKernel,DeepGemmFp8BlockScaledMMKernel
    command:
      - --model
      - Qwen/Qwen3-14B-AWQ        # AWQ beats FP8 on WSL2/Blackwell (FP8 cores not exposed via dxgkrnl)
      - --max-model-len
      - "16384"
      - --gpu-memory-utilization
      - "0.90"
      - --max-num-seqs
      - "4"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]



volumes:
  ollama_data:
  open_webui_data:
  vllm_cache: