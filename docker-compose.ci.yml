services:
  # ---------------------------------------------------------------
  # 1. Inference backend: Ollama (CPU mode for CI)
  # ---------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: local_ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=-1
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_CONTEXT_LENGTH=16384

  # ---------------------------------------------------------------
  # 2. Chat UI + tool surface: Open WebUI
  # ---------------------------------------------------------------
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:8080"
    volumes:
      - open_webui_data:/app/backend/data
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      - ollama

  # ---------------------------------------------------------------
  # 3. MCP -> OpenAPI bridge
  # ---------------------------------------------------------------
  mcpo:
    build: ./mcpo
    container_name: mcpo
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./workspace:/workspace
      - ./mcp:/opt/mcp
      - ./mcpo/config.json:/config/config.json:ro
      - ./agent-reports:/data/agent-reports
      - ./eval:/data/eval
      - .:/repo:ro

volumes:
  ollama_data:
  open_webui_data: