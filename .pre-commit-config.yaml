repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.0
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: system
        types: [shell]
        args: [-x]
        exclude: ^scripts/run-nightly.sh$

      - id: check-executables
        name: check shell scripts are executable
        entry: bash -c 'find scripts -name "*.sh" -exec test -x {} \; -print'
        language: system
        pass_filenames: false
        always_run: true