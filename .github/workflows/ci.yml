name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          pip install ruff shellcheck-py

      - name: Lint Python
        run: ruff check .

      - name: Lint shell scripts
        run: shellcheck scripts/*.sh

      - name: Check file permissions
        run: |
          for f in scripts/*.sh; do
            if [ ! -x "$f" ]; then
              echo "ERROR: $f is not executable"
              exit 1
            fi
          done

  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          pip install ruff

      - name: Start full stack with docker-compose
        run: |
          docker compose up -d --build
          # Wait for all services to be ready
          for i in {1..60}; do
            if curl -sf http://localhost:11434/api/tags >/dev/null && \
               curl -sf http://localhost:8000/local_ops/openapi.json >/dev/null; then
              echo "All services ready"
              break
            fi
            sleep 5
          done

      - name: Pull model (CPU)
        run: |
          curl -s http://localhost:11434/api/pull -d '{"name": "qwen3:8b"}'
          # Wait for model to be ready
          for i in {1..30}; do
            if curl -sf "http://localhost:11434/api/show?qwen3:8b" >/dev/null; then
              echo "Model ready"
              break
            fi
            sleep 5
          done

      - name: Run smoke test
        env:
          OLLAMA_URL: http://localhost:11434
        run: |
          bash scripts/smoke-test.sh

      - name: Cleanup
        if: always()
        run: docker compose down -v

  eval:
    name: Evaluation Suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Cache Ollama model
        uses: actions/cache@v4
        with:
          path: |
            ~/.ollama
          key: ollama-${{ runner.os }}-${{ hashFiles('docker-compose.yml') }}

      - name: Start services with docker-compose
        run: |
          docker compose up -d
          # Wait for Ollama API
          for i in {1..30}; do
            if curl -sf http://localhost:11434/api/tags >/dev/null; then
              echo "Ollama ready"
              break
            fi
            sleep 2
          done

      - name: Pull model
        run: |
          curl -s http://localhost:11434/api/pull -d '{"name": "qwen3:8b"}'

      - name: Run eval suite
        env:
          OLLAMA_URL: http://localhost:11434
        run: |
          cd eval
          bash ../scripts/run-eval.sh qwen3:8b
          python3 ../scripts/eval-summary.py

      - name: Check eval pass rate
        run: |
          python3 -c "
          import json
          with open('eval/history.jsonl') as f:
              last = json.loads(list(f)[-1])
              rate = last['passed'] / last['total']
              assert rate >= 1.0, 'Eval pass rate {:.0%} < 100%'.format(rate)
              print('Eval: {}/{} passed ({:.0%})'.format(last['passed'], last['total'], rate))
          "

      - name: Cleanup
        if: always()
        run: docker compose down -v